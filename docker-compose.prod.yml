# This override removes port mappings for production
services:
  nginx:
    volumes:
      - /etc/ssl/nwdaf/cert.pem:/etc/nginx/ssl/selfsigned.crt:ro
      - /etc/ssl/nwdaf/key.pem:/etc/nginx/ssl/selfsigned.key:ro

  kafka-1:
    ports: !reset []
  kafka-2:
    ports: !reset []
  kafka-3:
    ports: !reset []
  influxdb:
    ports: !reset []
  clickhouse:
    ports: !reset []
  #  data-storage:
  #    ports: !reset []
  mlservice:
    ports: !reset []
  #  mlflow:
  #    ports: !reset []
  policy-api:
    ports: !reset []
  permit:
    ports: !reset []
  frontend:
    ports: !reset []
  # nginx ports are KEPT
  #  postgres:
  #    ports: !reset []
  #  minio:
  #    ports: !reset []
  processor1:
    ports: !reset []

