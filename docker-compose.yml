services:

    #---- DataBases
    influxdb:
      image: influxdb:2.7-alpine
      container_name: influxdb
      ports:
        - "8086:8086"
      environment:
        - DOCKER_INFLUXDB_INIT_MODE=setup
        - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USER:-admin}
        - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-adminpassword}
        - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG:-myorg}
        - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET:-mybucket}
        - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-mytoken}
      volumes:
        - influxdb_data:/var/lib/influxdb2
        - influxdb_config:/etc/influxdb2
      networks:
        - nwdaf-network
      restart: unless-stopped

    clickhouse:
      image: clickhouse/clickhouse-server:latest
      container_name: clickhouse
      ports:
        - "8123:8123"
        - "9000:9000"
      environment:
        - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
        - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
        - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      volumes:
        - clickhouse_data:/var/lib/clickhouse
        - clickhouse_logs:/var/log/clickhouse-server
      networks:
        - nwdaf-network
      restart: unless-stopped

    #---- Middleware
    kafka:
      image: apache/kafka:4.1.1
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_NUM_PARTITIONS: 3
      networks:
        - nwdaf-network
      restart: unless-stopped

    #---- Services
    data-storage:
      container_name: data-storage
      ports:
        - "8000:8000"
      build:
        context: ./Data-Storage
        dockerfile: Dockerfile
      environment:
        - INFLUX_URL=http://influxdb:8086
        - INFLUX_TOKEN=${INFLUX_TOKEN:-mytoken}
        - INFLUX_ORG=${INFLUX_ORG:-myorg}
        - INFLUX_BUCKET=${INFLUX_BUCKET:-mybucket}
        - CLICKHOUSE_HOST=clickhouse
        - CLICKHOUSE_PORT=8123
        - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
        - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
        - KAFKA_HOST=kafka
        - KAFKA_PORT=9092
      depends_on:
        - clickhouse
        - influxdb
        - kafka
      networks:
        - nwdaf-network
      restart: unless-stopped

    ingestion:
      container_name: ingestion
      ports:
        - "7000:7000"
      build:
        context: ./Ingestion-Service
        dockerfile: Dockerfile
      environment:
        - KAFKA_HOST=kafka
        - KAFKA_PORT=9092
        - KAFKA_TOPIC=${KAFKA_TOPIC:-raw-data}
      depends_on:
        - kafka
      networks:
        - nwdaf-network
      restart: unless-stopped



volumes:
  influxdb_data:
  influxdb_config:
  clickhouse_data:
  clickhouse_logs:
  kafka_data:

networks:
  nwdaf-network:
    driver: bridge
